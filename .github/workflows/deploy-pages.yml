name: Validate dynamic dashboard

on:
  push:
    branches:
      - backend
  pull_request:
    branches:
      - backend
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dynamic-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate frontend data
        run: npm run validate:frontend-data

      - name: Test dashboard freshness behavior
        run: npm run test:dashboard

      - name: Lint application
        run: npm run lint

      - name: Build dynamic application
        run: npm run build

      - name: Verify standalone artifact excludes local secrets
        shell: bash
        run: test -z "$(find .next/standalone -type f -name '.env*' -print -quit)"

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pipeline dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Test pipeline
        run: python -m unittest discover -s tests -v

      - name: Validate data contract
        run: python scripts/validate_data_contract.py

  container:
    runs-on: ubuntu-latest
    needs:
      - application
      - pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Railway image
        run: docker build --tag emergency-dashboard:ci .

      - name: Validate packaged pipeline runtime
        run: |
          docker run --rm --entrypoint node emergency-dashboard:ci scripts/validate_frontend_data.mjs
          docker run --rm --entrypoint python emergency-dashboard:ci scripts/validate_data_contract.py

      - name: Smoke-test production container
        shell: bash
        run: |
          set -euo pipefail
          container_name=emergency-dashboard-ci
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container_name" \
            --publish 3000:3000 \
            --env PORT=3000 \
            emergency-dashboard:ci

          wait_until_healthy() {
            for attempt in {1..30}; do
              if curl --fail --silent --show-error http://127.0.0.1:3000/api/health >/dev/null; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          if ! wait_until_healthy; then
            docker logs "$container_name"
            exit 1
          fi
          html=$(curl --fail --silent --show-error http://127.0.0.1:3000/)
          asset=$(printf '%s' "$html" | grep -oE '/_next/static/[^" ]+' | head -n 1)
          test -n "$asset"
          curl --fail --silent --show-error "http://127.0.0.1:3000$asset" >/dev/null

          docker exec --user root "$container_name" \
            sh -c 'printf stale > /app/runtime/data/hira_match_overrides.csv'
          docker restart "$container_name" >/dev/null
          if ! wait_until_healthy; then
            docker logs "$container_name"
            exit 1
          fi
          for filename in \
            hira_match_exclusions.csv \
            hira_match_overrides.csv \
            hospital_coordinate_overrides.csv \
            hospital_region_overrides.csv; do
            docker exec "$container_name" \
              cmp "/app/data/$filename" "/app/runtime/data/$filename"
          done

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/backend' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified production image
        if: github.ref == 'refs/heads/backend' && github.event_name != 'pull_request'
        shell: bash
        run: |
          image=ghcr.io/westyoon/embulance-score
          docker tag emergency-dashboard:ci "$image:backend"
          docker tag emergency-dashboard:ci "$image:${GITHUB_SHA}"
          docker push "$image:backend"
          docker push "$image:${GITHUB_SHA}"
